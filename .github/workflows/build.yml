name: Build

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Backend (PyInstaller)
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r backend/requirements.txt
          pip install pyinstaller
          cp config/config.example.yaml config/config.yaml
          mkdir -p data
          touch data/.gitkeep
          pyinstaller \
            --name=Weix \
            --onedir \
            --console \
            --clean \
            --noconfirm \
            --paths=backend \
            --add-data "config:config" \
            --add-data "data:data" \
            --add-data "frontend/dist:frontend_dist" \
            --add-data "backend/app/core/mach_helper:app/core" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=sqlalchemy.ext.asyncio \
            --hidden-import=aiosqlite \
            --hidden-import=chromadb \
            --hidden-import=sentence_transformers \
            --hidden-import=tiktoken \
            --hidden-import=langchain \
            --hidden-import=jieba \
            --hidden-import=passlib.handlers.bcrypt \
            --hidden-import=pycryptodome \
            --collect-all chromadb \
            --collect-all sentence_transformers \
            backend/app/main.py

      - name: Package (DMG)
        run: |
          mkdir -p dist/Weix.app/Contents/MacOS
          cp -r dist/Weix/* dist/Weix.app/Contents/MacOS/
          cat > dist/Weix.app/Contents/MacOS/start_weix.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "$DIR/Weix" &
          echo "Weix: http://localhost:8000"
          wait
          EOF
          chmod +x dist/Weix.app/Contents/MacOS/start_weix.sh
          hdiutil create -volname Weix -srcfolder dist/Weix.app -ov -format UDZO dist/Weix-macOS.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weix-macOS
          path: dist/Weix-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Backend (PyInstaller)
        run: |
          python -m venv venv
          venv\Scripts\activate
          pip install -r backend/requirements.txt
          pip install pyinstaller
          copy config\config.example.yaml config\config.yaml
          New-Item -ItemType Directory -Force -Path data | Out-Null
          New-Item -ItemType File -Force -Path data/.gitkeep | Out-Null
          pyinstaller --name=Weix --onedir --console --clean --noconfirm --paths=backend --add-data "config;config" --add-data "data;data" --add-data "frontend/dist;frontend_dist" --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols.http.auto --hidden-import=sqlalchemy.ext.asyncio --hidden-import=aiosqlite --hidden-import=chromadb --hidden-import=sentence_transformers --hidden-import=tiktoken --hidden-import=langchain --hidden-import=jieba --hidden-import=passlib.handlers.bcrypt --hidden-import=pycryptodome --collect-all chromadb --collect-all sentence_transformers backend/app/main.py

      - name: Package (ZIP)
        run: |
          Compress-Archive -Path dist/Weix -DestinationPath dist/Weix-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weix-Windows
          path: dist/Weix-Windows.zip

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: weix-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Weix-macOS/Weix-macOS.dmg
            Weix-Windows/Weix-Windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Latest Test Build
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current_master="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq .object.sha)"
          if [[ "$current_master" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded build: $GITHUB_SHA"
            exit 0
          fi
          cat > release-notes.md << EOF
          ## 最新自动构建 · 测试版

          来自 master，提交：$GITHUB_SHA
          [构建日志](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID)

          - Windows：下载 Weix-Windows.zip，解压完整目录后运行 Weix.exe。
          - macOS：下载 Weix-macOS.dmg。Mac 界面自动回复仍待实机验证。
          - Web 管理地址：http://127.0.0.1:8000
          - 首次使用需填写自己的 API key、配置白名单，并授予本机所需权限。
          - 包内仅使用配置模板；不包含开发者密钥、聊天记录或本机数据库。

          此页面随 master 构建更新；测试版与正式版本分开展示。
          EOF
          files=(Weix-Windows/Weix-Windows.zip Weix-macOS/Weix-macOS.dmg)
          for file in "${files[@]}"; do test -s "$file"; done
          if gh release view nightly >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload nightly "${files[@]}" --clobber
            gh release edit nightly --title 'Weix · 最新测试版' --prerelease --latest=false --notes-file release-notes.md
          else
            gh release create nightly "${files[@]}" --target "$GITHUB_SHA" --title 'Weix · 最新测试版' --prerelease --latest=false --notes-file release-notes.md
          fi
